[package]
name = "curseforge_modpack_downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
hyper_connect = { path = "../hyper_connect", default-features = false, features = ["http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
